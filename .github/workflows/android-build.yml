name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      QT_VERSION: '6.7.3'
      ANDROID_PLATFORM: 'android-34'
      ANDROID_BUILD_TOOLS: '34.0.0'
      ANDROID_NDK_VERSION: '26.1.10909125'
      ANDROID_NDK_PLATFORM: 'android-26'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Qt
        run: |
          python3 -m pip install --user aqtinstall==3.3.0
          python3 -m aqt install-qt --outputdir "$PWD/Qt" linux android "$QT_VERSION" android_armv7 --autodesktop --modules qtmultimedia
          echo "QT_HOME=$PWD/Qt/$QT_VERSION" >> "$GITHUB_ENV"
          echo "$PWD/Qt/$QT_VERSION/android_armv7/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK and NDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | sudo "$SDKMANAGER" --licenses > /dev/null || true
          sudo "$SDKMANAGER" "platform-tools" "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          test -x "$SDK_ROOT/ndk/$ANDROID_NDK_VERSION/ndk-build"
          test -f "$SDK_ROOT/platforms/$ANDROID_PLATFORM/android.jar"

      - name: Build Android APK
        run: |
          : "${QT_HOME:?QT_HOME is empty}"
          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT is empty}"
          : "${ANDROID_NDK_ROOT:?ANDROID_NDK_ROOT is empty}"
          test -x "$ANDROID_NDK_ROOT/ndk-build"
          test -x "$QT_HOME/android_armv7/bin/qmake"

          python3 build/build_android_debug_travis.py \
            --build-dir=bin \
            --qt-root="$QT_HOME" \
            --voltair-root="$PWD" \
            --jdk="$JAVA_HOME" \
            --sdk-root="$ANDROID_SDK_ROOT" \
            --ndk-root="$ANDROID_NDK_ROOT" \
            --ndk-platform="$ANDROID_NDK_PLATFORM" \
            --android-platform="$ANDROID_PLATFORM" \
            --liquidfun-root=./third_party/liquidfun/liquidfun \
            --output-apk=VoltAir.apk \
            --num-processes=2

      - name: Verify APK exists
        run: |
          if [ ! -s bin/VoltAir.apk ]; then
            echo "::error::bin/VoltAir.apk was not produced (missing or empty)"
            echo "Contents of bin/:"
            ls -la bin/ || echo "bin/ directory does not exist"
            exit 1
          fi
          ls -la bin/VoltAir.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltAir-APK
          path: bin/VoltAir.apk
          if-no-files-found: error
