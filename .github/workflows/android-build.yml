name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      DISPLAY: ':99.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          # Qt 5.8 + ant + legacy `tools/android` requires JDK 8.
          # JDK 11 breaks ant builds (source/target 1.5-1.6 unsupported).
          distribution: 'temurin'
          java-version: '8'

      - name: Install dependencies
        run: |
          sudo apt-get update
          # NOTE: python2.7 is not available on ubuntu-22.04; the build script
          # runs on python3 (see build/build_android_debug_travis.py).
          sudo apt-get install -y p7zip-full ant lib32z1-dev lib32stdc++6

      - name: Start Xvfb
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

      - name: Set up Qt
        run: |
          export WORKDIR=$PWD

          # Download and set up Qt (using the same script from Travis)
          ./travisScripts/qt-5.8-android
          cat qt-5.8.0-android-travis.env
          # Fail fast with an actionable message if NDK extraction broke
          # (regression test for issue #76).
          test -x ./android-ndk-r9/ndk-build || { echo "::error::android-ndk-r9/ndk-build missing after setup (issue #76)"; ls -la; exit 1; }
          test -x ./android-ndk-r14b/ndk-build || { echo "::error::android-ndk-r14b/ndk-build missing after setup"; ls -la; exit 1; }
          source qt-5.8.0-android-travis.env
          ls "$QT_ROOT"
          # Persist Qt, SDK and NDK exports for subsequent steps.
          # NOTE (issue #76): $GITHUB_ENV expects "VAR=VALUE" lines, NOT
          # "export VAR=VALUE". Appending the file verbatim created variables
          # literally named "export QT_HOME" etc., leaving $QT_HOME,
          # $ANDROID_NDK9_ROOT, ... empty in later steps, which turned the
          # liquidfun build command into "/ndk-build" -> "No such file or
          # directory". Strip the leading "export " before persisting.
          # PATH is excluded here (it goes via GITHUB_PATH below).
          grep -v '^export PATH=' qt-5.8.0-android-travis.env | sed 's/^export //' >> $GITHUB_ENV
          # PATH entries go via GITHUB_PATH, not GITHUB_ENV.
          echo "$QT_HOME/android_armv7/bin" >> $GITHUB_PATH

      - name: Install legacy SDK for Qt 5.8
        run: |
          set -e
          # Qt 5.8 androiddeployqt hard-requires legacy SDK `tools/android`
          # (removed in SDK Tools 26+). GH ubuntu-22.04 runners only ship
          # cmdline-tools, so androiddeployqt aborts with:
          #   "Cannot find Android tool: .../sdk/tools/android" (exit 13).
          # Restore tools_r25.2.5 (last release with tools/android) plus
          # the android-18 platform and ant-compatible build-tools.
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          ls "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_ROOT/tools/android" ]; then
            echo "Installing legacy SDK Tools r25.2.5..."
            wget -q https://dl.google.com/android/repository/tools_r25.2.5-linux.zip -O /tmp/tools_r25.zip
            sudo unzip -qq -o /tmp/tools_r25.zip -d "$SDK_ROOT"
            rm -f /tmp/tools_r25.zip
          fi
          test -x "$SDK_ROOT/tools/android" || { echo "::error::tools/android still missing after install"; ls -la "$SDK_ROOT/tools" || true; exit 1; }
          echo "Accepting SDK licenses..."
          yes | sudo "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "Installing android-18 platform + build-tools..."
          sudo "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-18" "build-tools;26.0.2" "platform-tools"
          test -f "$SDK_ROOT/platforms/android-18/android.jar" || { echo "::error::android-18 platform missing"; ls "$SDK_ROOT/platforms" || true; exit 1; }
          ls "$SDK_ROOT/tools/android" "$SDK_ROOT/platforms/android-18/android.jar"

      - name: Build Android APK
        run: |
          export JDK=$JAVA_HOME
          export WORKDIR=$PWD

          # Fail fast if env propagation from "Set up Qt" broke (issue #76).
          # Without this, an empty $ANDROID_NDK9_ROOT turns the liquidfun
          # build command into "/ndk-build" with a cryptic
          # "OSError: [Errno 2] No such file or directory".
          : "${QT_HOME:?QT_HOME is empty - Qt setup / GITHUB_ENV propagation failed (issue #76)}"
          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT is empty}"
          : "${ANDROID_NDK_ROOT:?ANDROID_NDK_ROOT is empty}"
          : "${ANDROID_NDK9_ROOT:?ANDROID_NDK9_ROOT is empty - NDK R9 setup failed (issue #76)}"
          test -x "$ANDROID_NDK9_ROOT/ndk-build" || { echo "::error::ndk-build not found at $ANDROID_NDK9_ROOT/ndk-build (issue #76)"; ls -la "$ANDROID_NDK9_ROOT" || ls -la; exit 1; }
          test -x "$QT_HOME/android_armv7/bin/qmake" || { echo "::error::qmake not found at $QT_HOME/android_armv7/bin/qmake"; ls -la "$QT_HOME" || true; exit 1; }

          # Run the build script with the same parameters
          python3 build/build_android_debug_travis.py \
            --build-dir=bin \
            --qt-root=$QT_HOME \
            --voltair-root=$PWD \
            --jdk=$JDK \
            --sdk-root=$ANDROID_SDK_ROOT \
            --ndk-root=$ANDROID_NDK_ROOT \
            --ndk-rootR9=$ANDROID_NDK9_ROOT \
            --ant=/usr/bin/ant \
            --liquidfun-root=./third_party/liquidfun/liquidfun \
            --output-apk=VoltAir.apk \
            --num-processes=2

      - name: Verify APK exists
        run: |
          if [ ! -s bin/VoltAir.apk ]; then
            echo "::error::bin/VoltAir.apk was not produced (missing or empty)"
            echo "Contents of bin/:"
            ls -la bin/ || echo "bin/ directory does not exist"
            exit 1
          fi
          ls -la bin/VoltAir.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltAir-APK
          path: bin/VoltAir.apk
          if-no-files-found: error
