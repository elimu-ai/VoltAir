name: Release APK

# Manually triggered (Actions -> "Release APK" -> Run workflow).
#
# Development versions carry a "-SNAPSHOT" suffix in AndroidManifest.xml
# (e.g. 1.0.5-SNAPSHOT). Releasing it:
#
#   1. prepare  Drops the suffix in a release commit (1.0.5) and pushes it to a
#               temporary branch, so the APK and the tag both say 1.0.5 and
#               never 1.0.5-SNAPSHOT.
#   2. build    Builds that commit via android-build.yml (including the
#               emulator smoke test).
#   3. release  Signs the APK with the organization's release keystore, tags
#               the release commit (e.g. 1.0.5, no "v" prefix, like the
#               existing tags), publishes the GitHub release with the signed
#               APK attached, merges the release commit into the default branch
#               and sets the next development version (e.g. 1.0.6-SNAPSHOT).
#   4. notify_webapp_api
#               Tells each elimu.ai webapp (eng, hin, tgl, tha, vie) about the
#               new version and the URL of the signed APK on the release.
#   5. cleanup  Deletes the temporary branch.
#
# Nothing is tagged, released or pushed to the default branch unless the build
# and smoke test pass and the APK has been signed.
#
# Signing uses the same organization-wide secrets as the other elimu.ai
# Android apps (e.g. elimu-ai/vitabu):
#   SIGN_ANDROID_KEY                 base64-encoded keystore
#   SIGN_ANDROID_ALIAS               key alias
#   SIGN_ANDROID_KEY_STORE_PASSWORD  keystore password
#   SIGN_ANDROID_KEY_PASSWORD        key password
# The organization secrets must be made available to this repository.
# The emulator smoke test runs on the debug-signed build; signing only
# re-signs the same APK contents.

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      next_bump:
        description: 'Next development version after releasing'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# Never run two releases at once (they would race on the tag and the bump).
concurrency:
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    # Releases are cut from the default branch only.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      # Fail before anything is pushed or built if the APK could not be signed
      # later, instead of after a long build.
      - name: Check that signing secrets are available
        env:
          SIGN_ANDROID_KEY: ${{ secrets.SIGN_ANDROID_KEY }}
          SIGN_ANDROID_ALIAS: ${{ secrets.SIGN_ANDROID_ALIAS }}
          SIGN_ANDROID_KEY_STORE_PASSWORD: ${{ secrets.SIGN_ANDROID_KEY_STORE_PASSWORD }}
          SIGN_ANDROID_KEY_PASSWORD: ${{ secrets.SIGN_ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in SIGN_ANDROID_KEY SIGN_ANDROID_ALIAS SIGN_ANDROID_KEY_STORE_PASSWORD SIGN_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or not available to this repository (organization secrets must be shared with VoltAir)."
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Create release commit
        id: release
        run: |
          # Fails unless the manifest holds a -SNAPSHOT version.
          VERSION="$(.github/scripts/version.sh release)"
          echo "VERSION $VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists. Set the next development version in AndroidManifest.xml (e.g. .github/scripts/version.sh bump patch) and merge that first."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $VERSION"
          # Temporary branch, deleted by the cleanup job. Forced so a leftover
          # from an earlier failed run cannot block this one.
          git push --force origin "HEAD:refs/heads/release-$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION from $(git rev-parse --short HEAD)"

  build:
    needs: prepare
    uses: ./.github/workflows/android-build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      BRANCH: ${{ github.event.repository.default_branch }}
      NEXT_BUMP: ${{ inputs.next_bump }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: VoltAir-APK

      # The build produces a debug-signed APK. Replace that signature with the
      # release key (zipalign + apksigner, done by the action) before tagging.
      - name: Move APK to its own directory for signing
        run: |
          mkdir -p apk-to-sign
          mv VoltAir.apk apk-to-sign/VoltAir.apk

      - name: Install Android build-tools 34.0.0 if missing
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK_ROOT/build-tools/34.0.0/apksigner" ]; then
            yes | sudo "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null
          fi
          test -x "$SDK_ROOT/build-tools/34.0.0/apksigner" || { echo "::error::apksigner missing in build-tools 34.0.0"; exit 1; }

      # The ant build produces an unaligned APK (many uncompressed assets sit at
      # offsets that are not 4-byte aligned). sign-android-release only *checks*
      # alignment (zipalign -c) and fails on an unaligned input, so align it here.
      # Aligning has to happen before signing: apksigner signs the final bytes.
      - name: Zipalign the APK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ZIPALIGN="$SDK_ROOT/build-tools/34.0.0/zipalign"
          # Aligned outside apk-to-sign: the signing action expects exactly one APK there.
          "$ZIPALIGN" -p -f 4 apk-to-sign/VoltAir.apk "$RUNNER_TEMP/VoltAir-aligned.apk"
          "$ZIPALIGN" -c -v 4 "$RUNNER_TEMP/VoltAir-aligned.apk" | tail -n 1
          mv -f "$RUNNER_TEMP/VoltAir-aligned.apk" apk-to-sign/VoltAir.apk

      - name: Sign the APK file
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: apk-to-sign
          signingKeyBase64: ${{ secrets.SIGN_ANDROID_KEY }}
          alias: ${{ secrets.SIGN_ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.SIGN_ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGN_ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Verify the APK signature
        env:
          SIGNED_APK: ${{ steps.sign_app.outputs.signedReleaseFile }}
        run: |
          test -s "$SIGNED_APK" || { echo "::error::Signed APK not found: $SIGNED_APK"; exit 1; }
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CERTS="$("$SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$SIGNED_APK")"
          echo "$CERTS"
          # Never publish an APK that is still signed with the Android debug key.
          if echo "$CERTS" | grep -qi "Android Debug"; then
            echo "::error::APK is still signed with the Android debug certificate"
            exit 1
          fi

      - name: Create tag and GitHub release
        env:
          SIGNED_APK: ${{ steps.sign_app.outputs.signedReleaseFile }}
        run: |
          mv "$SIGNED_APK" "ai.elimu.voltair-$VERSION.apk"
          gh release create "$VERSION" "ai.elimu.voltair-$VERSION.apk" \
            --target "$RELEASE_SHA" \
            --title "$VERSION" \
            --generate-notes

      - name: Merge release and set next development version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The default branch may have moved while the build was running. A
          # fast-forward is used when it has not; otherwise a merge commit.
          if ! git merge --no-edit -m "Merge release $VERSION" "$RELEASE_SHA"; then
            git merge --abort || true
            echo "::warning::Could not merge release $VERSION into $BRANCH (conflict, probably someone changed the version meanwhile). The release is published; set the next development version by hand."
            exit 0
          fi

          CURRENT="$(.github/scripts/version.sh get)"
          if [ "$CURRENT" != "$VERSION" ]; then
            git reset --hard "origin/$BRANCH"
            echo "::warning::After merging, the version is $CURRENT, not $VERSION. Skipping the automatic bump; set the next development version by hand."
            exit 0
          fi

          NEXT="$(.github/scripts/version.sh bump "$NEXT_BUMP")"
          git commit -am "chore: start $NEXT development [skip ci]"
          git push origin "HEAD:$BRANCH"
          echo "Released $VERSION, now on $NEXT"

  # Tells the elimu.ai webapps that a new version of the app is available, by
  # sending the URL of the signed APK on the GitHub release (same as the other
  # elimu.ai Android apps, e.g. elimu-ai/vitabu). Only runs when the release
  # job succeeded. One language at a time, so a failure is easy to pinpoint.
  notify_webapp_api:
    needs: [prepare, release]
    strategy:
      max-parallel: 1
      matrix:
        language_code: [ eng, hin, tgl, tha, vie ]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Prepare the APK file URL
        id: apk_file_url
        run: |
          APK_FILE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/ai.elimu.voltair-$VERSION.apk"
          echo "APK_FILE_URL $APK_FILE_URL"
          echo "apk_file_url=$APK_FILE_URL" >> "$GITHUB_OUTPUT"

      - name: Send HTTP request to `${{ matrix.language_code }}.elimu.ai`
        uses: fjogeleit/http-request-action@v2
        with:
          url: http://${{ matrix.language_code }}.elimu.ai/rest/v2/applications/ai.elimu.voltair/application-versions/${{ needs.prepare.outputs.version }}
          method: PUT
          data: '{"fileUrl": "${{ steps.apk_file_url.outputs.apk_file_url }}"}'
          customHeaders: '{"Content-Type": "application/json"}'
          timeout: 60000

  cleanup:
    needs: [prepare, build, release]
    # Also runs when the build or release failed, so no branch is left behind.
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Delete temporary release branch
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release-$VERSION" \
            || echo "Branch release-$VERSION was already gone"
